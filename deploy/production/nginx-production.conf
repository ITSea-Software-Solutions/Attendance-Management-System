upstream php_backend {
    server backend:9000;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name yourdomain.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.in;

    ssl_certificate     /etc/letsencrypt/live/yourdomain.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/frontend-dist;      # BUILT frontend (npm run build output)
    index index.html;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Block dotfiles outright (no Vite dep-cache exception needed in prod)
    location ~ /\. { deny all; }

    # ── Backend API ─────────────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }
    location ~ ^/(sanctum|storage) {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    # ── Static frontend: hashed assets cached hard, SPA fallback ────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
