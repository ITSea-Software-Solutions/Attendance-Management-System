upstream php_backend {
    server backend:9000;
}

upstream frontend_dev {
    server frontend:5173;
}

server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # ─── App binaries ─────────────────────────────────────────────────────────
    # Serve these straight off disk. Without this they fall through to the SPA,
    # so a stale link (an old bookmark, a printed QR code) returns 200 with
    # index.html — a 924-byte file that saves as a corrupt .apk instead of
    # failing honestly. Missing binary must 404.
    location /downloads/ {
        alias /var/www/frontend/public/downloads/;
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options nosniff;
    }

    # ─── Frontend (proxy to Vite dev server) ─────────────────────────────────
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── Backend API ──────────────────────────────────────────────────────────
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ ^/(sanctum|storage) {
        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # ─── Static files ─────────────────────────────────────────────────────────
    # NOTE: This stack runs the Vite DEV server (frontend target = dev), so ALL
    # assets — including .js (Vite dep bundles like react.js) and .css — must be
    # proxied to Vite via `location /`. A regex `location ~* \.(js|css|...)$` with
    # `try_files $uri =404` here would shadow that proxy and 404 every module,
    # leaving a blank screen. Only re-introduce a static block for a PRODUCTION
    # build, where built assets actually live in nginx's public dir.

    # ─── Security Headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block .env and hidden files — but NOT Vite's dep cache. In dev mode Vite
    # serves optimized dependency bundles from /node_modules/.vite/deps/*; a blunt
    # `location ~ /\.` would deny that dot-directory and 403 every dep (react, etc.),
    # blanking the page. The negative lookahead keeps .env/.git/etc. blocked while
    # allowing /.vite/.
    location ~ /\.(?!vite/) {
        deny all;
    }
    location ~ /\.env {
        deny all;
    }
}
